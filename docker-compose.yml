services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-main
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DEBUG: ${DEBUG:-1}
      SERVICES: s3,sqs,sns,logs,cloudwatch,xray,lambda,apigateway,events,secretsmanager
      PERSISTENCE: 1
    volumes:
      - ./.data/localstack/home:/home/localstack
      - ./.data/localstack/lib:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"

  db:
    container_name: db
    image: mysql:8.0.41
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql:/var/lib/mysql

